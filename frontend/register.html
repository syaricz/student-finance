<!DOCTYPE html>
<html lang="id" data-auth="guest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <title>Daftar - Student Finance</title>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <main class="auth-wrap">
    <a class="sf-brand" href="index.html">
      <img src="assets/img/logo.svg" alt="" width="32" height="32">
      <span>Student Finance</span>
    </a>

    <div class="card auth-card">
      <div class="card-body p-4">
        <h1 class="h3 fw-semibold mb-1">Buat akun</h1>
        <p class="text-secondary mb-4">Gratis, dan siap dipakai dalam satu menit.</p>

        <div id="formAlert" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Nama lengkap</label>
            <input type="text" class="form-control" id="name" name="name" autocomplete="name" minlength="2" maxlength="100" required>
            <div class="invalid-feedback">Nama minimal 2 karakter.</div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" maxlength="150" required>
            <div class="invalid-feedback">Masukkan email yang valid.</div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group has-validation">
              <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="passwordHelp" required>
              <button type="button" class="btn btn-outline-secondary" data-toggle-password="password" aria-pressed="false">Lihat</button>
              <div class="invalid-feedback">Password minimal 8 karakter.</div>
            </div>
            <div id="passwordHelp" class="form-text">Minimal 8 karakter.</div>
          </div>

          <div class="mb-4">
            <label for="confirm_password" class="form-label">Konfirmasi password</label>
            <div class="input-group has-validation">
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
              <button type="button" class="btn btn-outline-secondary" data-toggle-password="confirm_password" aria-pressed="false">Lihat</button>
              <div class="invalid-feedback">Konfirmasi harus sama dengan password.</div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Daftar</button>
        </form>
      </div>
    </div>

    <p class="text-secondary mt-4 mb-0">Sudah punya akun? <a href="login.html">Masuk</a></p>
  </main>
</body>
</html>
