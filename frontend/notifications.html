<!DOCTYPE html>
<html lang="id" data-auth="protected">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <title>Notifikasi - Student Finance</title>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/layout.js" defer></script>
</head>
<body data-page="notifications">
  <div id="navbar-placeholder"></div>

  <div class="sf-shell">
    <div id="sidebar-placeholder"></div>

    <main class="sf-main">
      <div class="sf-content sf-medium">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
          <div>
            <h1 class="h3 fw-semibold mb-1">Notifikasi</h1>
            <p class="text-secondary mb-0">Peringatan saat pengeluaran mendekati atau melewati anggaran.</p>
          </div>
          <button type="button" class="btn btn-outline-primary" id="markAllBtn" disabled>Tandai semua dibaca</button>
        </div>

        <div class="btn-group sf-seg mb-3" role="group" aria-label="Filter notifikasi">
          <button type="button" class="btn btn-outline-primary btn-sm active" id="tabAll" aria-pressed="true">Semua</button>
          <button type="button" class="btn btn-outline-primary btn-sm" id="tabUnread" aria-pressed="false">Belum dibaca<span id="tabUnreadCount"></span></button>
        </div>

        <div id="pageAlert" class="alert d-none" role="alert"></div>
        <p id="loading" class="text-secondary">Memuat notifikasi...</p>

        <ul class="list-unstyled d-grid gap-2 mb-0 d-none" id="notifPageList" aria-label="Daftar notifikasi"></ul>

        <div id="emptyState" class="card d-none" aria-live="polite">
          <div class="card-body text-center py-5">
            <p class="mb-0" id="emptyText">Belum ada notifikasi.</p>
          </div>
        </div>

        <div id="pager" class="d-flex justify-content-between align-items-center gap-2 mt-3 d-none">
          <button type="button" class="btn btn-outline-secondary" id="prevPage">‹ Sebelumnya</button>
          <span class="small text-secondary" id="pageInfo"></span>
          <button type="button" class="btn btn-outline-secondary" id="nextPage">Berikutnya ›</button>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
