<!DOCTYPE html>
<html lang="id" data-auth="guest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <title>Lupa password - Student Finance</title>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
</head>
<body>
  <main class="auth-wrap">
    <a class="sf-brand" href="index.html">
      <img src="assets/img/logo.svg" alt="" width="32" height="32">
      <span>Student Finance</span>
    </a>

    <div class="card auth-card">
      <div class="card-body p-4">
        <h1 class="h3 fw-semibold mb-1">Lupa password</h1>
        <p class="text-secondary mb-4">Masukkan email akun Anda untuk meminta reset password.</p>

        <div id="formAlert" class="alert d-none" role="alert"></div>

        <form id="forgotForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            <div class="invalid-feedback">Masukkan email yang valid.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100">Kirim link reset</button>
        </form>
      </div>
    </div>

    <p class="text-secondary mt-4 mb-0"><a href="login.html">Kembali ke halaman masuk</a></p>
  </main>
</body>
</html>
