<!-- Topbar: tombol menu, logo, search, notifikasi, avatar. Dimuat lewat fetch() oleh layout.js -->
<header class="sf-header" role="banner">
  <!-- Mobile & tablet: buka sidebar sebagai offcanvas -->
  <button type="button" class="sf-icon-btn d-lg-none" id="sidebarToggle"
          data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar"
          aria-label="Buka menu navigasi">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <!-- Desktop: ciutkan / lebarkan sidebar -->
  <button type="button" class="sf-icon-btn d-none d-lg-inline-flex" id="sidebarCollapseBtn"
          aria-controls="sidebar" aria-pressed="false" aria-label="Ciutkan sidebar" title="Ciutkan sidebar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
  </button>

  <a class="sf-brand" href="dashboard.html">
    <img src="assets/img/logo.svg" alt="" width="32" height="32">
    <span class="d-none d-sm-inline">Student Finance</span>
  </a>

  <!-- Search global: mengirim kata kunci ke halaman Transaksi -->
  <form class="sf-search" id="globalSearch" action="transactions.html" method="get" role="search">
    <label for="globalSearchInput" class="visually-hidden">Cari transaksi</label>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" class="form-control" id="globalSearchInput" name="search"
           placeholder="Cari transaksi..." maxlength="100" autocomplete="off">
  </form>

  <div class="d-flex align-items-center gap-1 ms-auto">
    <!-- Notifikasi -->
    <div class="dropdown">
      <button type="button" class="sf-icon-btn" id="notifBtn" data-bs-toggle="dropdown" aria-expanded="false"
              aria-label="Notifikasi">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="sf-badge d-none" id="notifBadge" aria-hidden="true">0</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end sf-dropdown sf-notif-menu" aria-labelledby="notifBtn">
        <div class="sf-dropdown-head d-flex justify-content-between align-items-center gap-2">
          <span class="fw-semibold">Notifikasi</span>
          <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" id="notifReadAll" disabled>Tandai semua dibaca</button>
        </div>
        <ul class="sf-notif-list list-unstyled mb-0" id="notifList">
          <li class="sf-dropdown-empty">Memuat...</li>
        </ul>
        <a class="sf-dropdown-foot" href="notifications.html">Lihat semua notifikasi</a>
      </div>
    </div>

    <!-- Akun -->
    <div class="dropdown">
      <button type="button" class="sf-avatar-btn" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false"
              aria-label="Menu akun">
        <span class="sf-avatar" data-user-initials>?</span>
      </button>
      <div class="dropdown-menu dropdown-menu-end sf-dropdown" aria-labelledby="userMenuBtn">
        <div class="sf-dropdown-head">
          <div class="fw-semibold text-truncate" data-user-name></div>
          <div class="small text-secondary text-truncate" data-user-email></div>
        </div>
        <span class="dropdown-item sf-menu-item disabled" aria-disabled="true">Profil <small class="ms-auto">Segera</small></span>
        <span class="dropdown-item sf-menu-item disabled" aria-disabled="true">Pengaturan <small class="ms-auto">Segera</small></span>
        <hr class="dropdown-divider">
        <button type="button" class="dropdown-item sf-menu-item text-danger" data-logout>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Keluar
        </button>
      </div>
    </div>
  </div>
</header>
